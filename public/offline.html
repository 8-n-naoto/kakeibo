<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>オフライン | 家計簿アプリ</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f8fafc;
            color: #334155;
            font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", sans-serif;
            padding: 24px;
        }
        .card {
            background: #fff;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            padding: 32px 24px;
            max-width: 360px;
            text-align: center;
            box-shadow: 0 1px 2px rgba(15, 23, 42, .05);
        }
        h1 { font-size: 18px; margin: 0 0 8px; }
        p { font-size: 14px; line-height: 1.7; color: #64748b; margin: 0 0 20px; }
        button {
            background: #059669;
            color: #fff;
            border: 0;
            border-radius: 8px;
            padding: 10px 20px;
            font-size: 14px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="card">
        <div style="font-size:40px;line-height:1">📒</div>
        <h1>オフラインです</h1>
        <p>
            家計簿アプリはサーバーに接続して動きます。<br>
            Wi-Fi や回線の状態を確認してから、もう一度お試しください。
        </p>
        <button onclick="location.reload()">再読み込み</button>
    </div>
</body>
</html>
